name: ranonis-control-center

services:
  control-centre:
    build: .
    image: ranonis-control-center:latest
    container_name: ranonis-control-center
    restart: unless-stopped
    environment:
      PORT: "3080"
      BASE_PATH: /control-centre
      CONTROL_CENTRE_PASSWORD: ${CONTROL_CENTRE_PASSWORD}
      CONTROL_CENTRE_TOKEN: ${CONTROL_CENTRE_TOKEN}
      DATA_DIR: /app/data
      HERMES_CONTAINER: ${HERMES_CONTAINER:-hermes-agent-57r8-hermes-agent-1}
    volumes:
      - control_centre_data:/app/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=ranonis-control-center_web
      - traefik.http.routers.ranonis-cc.rule=Host(`ranonisandpartners.com`) && PathPrefix(`/control-centre`)
      - traefik.http.routers.ranonis-cc.entrypoints=websecure
      - traefik.http.routers.ranonis-cc.tls.certresolver=letsencrypt
      - traefik.http.routers.ranonis-cc.priority=100
      - traefik.http.services.ranonis-cc.loadbalancer.server.port=3080

  # Same project only — docker-exec into Hermes; never touches other compose stacks.
  hermes-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: ranonis-cc-hermes-bridge:latest
    container_name: ranonis-cc-hermes-bridge
    restart: unless-stopped
    environment:
      CC_URL: http://control-centre:3080/control-centre
      CONTROL_CENTRE_TOKEN: ${CONTROL_CENTRE_TOKEN}
      HERMES_CONTAINER: ${HERMES_CONTAINER:-hermes-agent-57r8-hermes-agent-1}
      POLL_SECONDS: ${HERMES_BRIDGE_POLL_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    depends_on:
      - control-centre

volumes:
  control_centre_data:

networks:
  web:
    name: ranonis-control-center_web
